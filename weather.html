<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12283d">
<title>天光 · 天气预报</title>
<style>
:root{--ink:#f6f6e9;--soft:rgba(246,246,233,.72);--glass:rgba(17,31,38,.34);--edge:rgba(255,255,255,.17);--sun:#ffe7a0;--mint:#b7f2dc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
body{min-height:100vh;overflow-x:hidden;background:#0b1728}
.scene{position:fixed;inset:0;overflow:hidden;z-index:-2;background:radial-gradient(ellipse at 22% 77%,rgba(255,209,113,.84),transparent 25%),radial-gradient(ellipse at 80% 75%,rgba(224,143,85,.74),transparent 28%),radial-gradient(ellipse at 50% 56%,rgba(137,191,169,.5),transparent 38%),linear-gradient(180deg,#071426 0%,#10293b 27%,#41656a 49%,#d2aa6d 75%,#172425 100%)}
.scene:before{content:"";position:absolute;inset:-15%;background:radial-gradient(ellipse at 42% 62%,transparent 0 14%,rgba(255,239,180,.22) 32%,transparent 58%);filter:blur(22px);transform:rotate(-12deg)}
.scene:after{content:"";position:absolute;inset:58% -10% -20%;background:linear-gradient(180deg,transparent,#111d20 68%);opacity:.82}
.stars{position:absolute;inset:0 0 42%;pointer-events:none}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#e3f3ff;box-shadow:0 0 7px 2px #65aeff;opacity:.55;animation:twinkle 3.8s ease-in-out infinite alternate}.star:nth-child(4n){width:3px;height:3px;opacity:.86}.star:nth-child(3n){animation-delay:-1.7s}@keyframes twinkle{to{opacity:.2;transform:scale(.72)}}
.page{width:min(1260px,100%);min-height:100vh;margin:auto;padding:34px 48px 32px;display:flex;flex-direction:column;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;letter-spacing:.16em}.brandmark{width:36px;height:36px;border:1px solid #ffffff60;border-radius:50%;display:grid;place-items:center;background:#ffffff14;backdrop-filter:blur(10px)}.brandmark svg{width:20px}.nav{display:flex;align-items:center;gap:9px}.city-wrap{position:relative}.city-select{appearance:none;background:#12263360;border:1px solid var(--edge);border-radius:999px;color:var(--ink);font-size:13px;padding:10px 36px 10px 15px;outline:none;cursor:pointer;backdrop-filter:blur(12px)}.city-select option{background:#172b38}.city-wrap:after{content:"⌄";position:absolute;right:14px;top:8px;color:#fff;pointer-events:none}.unit-toggle{width:39px;height:39px;border:1px solid var(--edge);border-radius:50%;background:#12263360;color:var(--ink);font-size:14px;cursor:pointer;backdrop-filter:blur(12px)}.unit-toggle:hover,.city-select:hover{background:#ffffff25}
.hero{flex:1;min-height:340px;display:flex;align-items:center;padding:34px 0 30px}.hero-copy{max-width:600px}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:13px;letter-spacing:.14em;text-transform:uppercase}.live-dot{height:6px;width:6px;border-radius:50%;background:#c6f7de;box-shadow:0 0 12px #c6f7de}.hero h1{margin:18px 0 2px;font-weight:400;font-size:clamp(58px,9vw,100px);line-height:.96;letter-spacing:-.07em;font-variant-numeric:tabular-nums;text-shadow:0 5px 35px #182d3266}.degree{font-size:.46em;vertical-align:top;line-height:1.7;letter-spacing:-.03em}.condition{margin-top:12px;font-size:20px;font-weight:500}.summary{margin:7px 0 0;color:var(--soft);font-size:14px}.weather-art{position:absolute;left:min(47%,550px);top:23%;width:clamp(180px,26vw,300px);height:auto;filter:drop-shadow(0 14px 30px #ffe49b38);opacity:.95}.sun-halo{position:absolute;left:57%;top:30%;width:145px;height:145px;border-radius:50%;background:#ffe5a9;filter:blur(1px);box-shadow:0 0 60px 25px #ffe4a155,0 0 160px 70px #ffce7940;opacity:.9}
.metrics{display:flex;gap:30px;margin-top:34px}.metric{display:flex;align-items:center;gap:10px;color:#f7f2df}.metric svg{width:18px;height:18px;opacity:.8}.metric-label{font-size:11px;color:var(--soft);letter-spacing:.04em}.metric-value{font-size:13px;font-weight:600;margin-top:2px}
.forecast{margin-top:auto;border:1px solid var(--edge);border-radius:22px;background:linear-gradient(135deg,rgba(14,28,33,.48),rgba(13,31,39,.32));backdrop-filter:blur(18px);box-shadow:0 18px 60px #08101935;overflow:hidden}.forecast-head{display:flex;justify-content:space-between;align-items:center;padding:20px 23px 14px}.forecast-title{font-size:13px;font-weight:650;letter-spacing:.09em}.forecast-note{font-size:11px;color:var(--soft)}.days{display:grid;grid-template-columns:repeat(7,1fr)}.day{min-width:0;padding:17px 12px 19px 17px;border-right:1px solid rgba(255,255,255,.11);transition:background .2s}.day:last-child{border:0}.day:hover{background:#ffffff12}.day.today{background:linear-gradient(180deg,rgba(255,224,153,.14),rgba(255,255,255,.035))}.day-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--soft)}.day.today .day-label{color:#fff0bd}.day-icon{height:46px;margin:12px 0 7px;display:flex;align-items:center}.day-icon svg{width:39px;height:39px;overflow:visible;filter:drop-shadow(0 2px 8px #fff4)}.day-condition{font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.temps{display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}.temps small{font-size:12px;color:var(--soft);font-weight:500}.precip{margin-top:8px;height:14px;font-size:10px;color:#c4e7f8;opacity:.85}.footer{display:flex;justify-content:space-between;align-items:center;padding:13px 4px 0;color:#fff9;font-size:10px;letter-spacing:.04em}.refresh{border:0;background:none;color:#fff9;font:inherit;cursor:pointer;padding:5px 0}.refresh:hover{color:#fff}
@media(max-width:720px){.page{padding:22px 20px 20px}.hero{min-height:330px;align-items:flex-start;padding-top:65px}.weather-art{left:auto;right:5%;top:25%;width:190px;opacity:.8}.sun-halo{left:auto;right:13%;top:30%;width:92px;height:92px}.metrics{gap:18px;flex-wrap:wrap}.days{grid-template-columns:repeat(7,minmax(100px,1fr));overflow:auto}.forecast{overflow:hidden}.day{padding:15px 12px}.forecast-head{padding:17px 17px 12px}.footer{padding-top:10px}}
@media(max-width:430px){.brand{font-size:13px}.nav{gap:6px}.city-select{max-width:142px;font-size:12px;padding-left:12px}.hero{min-height:330px;padding-top:54px}.weather-art{width:145px;top:30%;right:2%}.sun-halo{width:72px;height:72px;top:35%;right:11%}.hero h1{font-size:72px}.metrics{gap:14px}.metric{gap:7px}.metric-value{font-size:12px}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><div class="stars" id="stars"></div><div class="sun-halo"></div></div>
<main class="page">
<header class="topbar"><div class="brand"><span class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 15.5A4.5 4.5 0 0 1 8.5 11h.7A6.2 6.2 0 1 1 21 14.2"/><path d="M5 19h11M8 22h8"/></svg></span><span>天光 <span style="font-weight:400;opacity:.72">/ WEATHER</span></span></div><div class="nav"><label class="city-wrap"><select class="city-select" id="city" aria-label="选择城市"><option value="hangzhou">杭州 · 中国</option><option value="shanghai">上海 · 中国</option><option value="beijing">北京 · 中国</option><option value="chengdu">成都 · 中国</option><option value="tokyo">东京 · 日本</option></select></label><button class="unit-toggle" id="unit" aria-label="切换温度单位">°C</button></div></header>
<section class="hero"><div class="hero-copy"><div class="eyebrow"><i class="live-dot"></i><span id="date">今天 · 4月22日</span><span> / </span><span id="location">杭州</span></div><h1><span id="current">26</span><span class="degree">°</span></h1><div class="condition" id="condition">晴间多云</div><p class="summary" id="summary">天空渐晴，适合出门走走。</p><div class="metrics"><div class="metric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 15a4 4 0 0 1 7.5-2h1a4 4 0 1 1 .5 8H6a4 4 0 0 1-3-6Z"/><path d="m14 7 2-2m2 5 3-1"/></svg><div><div class="metric-label">体感温度</div><div class="metric-value" id="feels">29°</div></div></div><div class="metric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h12a3 3 0 1 0-3-3M2 12h17a3 3 0 1 1-3 3M4 16h8a3 3 0 1 1-3 3"/></svg><div><div class="metric-label">风速</div><div class="metric-value" id="wind">7 km/h</div></div></div><div class="metric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg><div><div class="metric-label">紫外线</div><div class="metric-value" id="uv">中等 · 5</div></div></div></div></div>
<svg class="weather-art" viewBox="0 0 260 190" fill="none" aria-hidden="true"><circle cx="164" cy="70" r="33" fill="#FFE7A6"/><g stroke="#FFF2CA" stroke-width="4" stroke-linecap="round"><path d="M164 19V8m0 124v-11m51-51h11M102 70H91m109-36 8-8M128 114l-8 8m88-88 8-8m-88 88-8 8"/></g><path d="M41 137c0-16 13-29 29-29 5 0 10 1 14 4 7-21 27-36 50-36 28 0 51 22 52 50 15 1 27 13 27 28 0 16-13 29-29 29H71c-17 0-30-13-30-29 0-6 0-11 0-17Z" fill="#233B43" fill-opacity=".78" stroke="#F8F5DF" stroke-width="5" stroke-linejoin="round"/><path d="M76 145c0-15 11-27 26-27 5 0 10 1 14 4 7-17 23-29 42-29" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/></svg>
</section>
<section class="forecast"><div class="forecast-head"><div class="forecast-title">未来七天</div><div class="forecast-note">一周天气趋势</div></div><div class="days" id="days"></div></section>
<footer class="footer"><span>天光 WEATHER · 抬头看看天空</span><button class="refresh" id="refresh">↻　更新预报</button></footer>
</main>
<script>
(()=>{
const cities={
 hangzhou:{name:'杭州',now:26,feels:29,condition:'晴间多云',summary:'天空渐晴，适合出门走走。',wind:7,uv:5,forecast:[['晴间多云','partly',28,19,10],['晴朗','sun',31,20,0],['多云','cloud',28,18,10],['小雨','rain',26,19,65],['多云','cloud',23,17,20],['雷阵雨','storm',24,18,70],['阵雨','showers',20,16,60]]},
 shanghai:{name:'上海',now:24,feels:26,condition:'微风多云',summary:'云层疏朗，午后有温柔的阳光。',wind:11,uv:4,forecast:[['多云','cloud',27,20,15],['晴朗','sun',29,21,0],['晴间多云','partly',26,19,10],['小雨','rain',23,18,55],['阵雨','showers',22,17,45],['晴朗','sun',25,18,0],['多云','cloud',24,19,15]]},
 beijing:{name:'北京',now:22,feels:21,condition:'晴朗',summary:'晴空舒展，空气清爽宜人。',wind:9,uv:6,forecast:[['晴朗','sun',27,15,0],['晴间多云','partly',29,17,5],['多云','cloud',26,16,10],['晴朗','sun',28,17,0],['多云','cloud',25,15,15],['阵雨','showers',23,14,35],['晴朗','sun',26,16,0]]},
 chengdu:{name:'成都',now:20,feels:21,condition:'云雾轻绕',summary:'云朵漫游，带一件薄外套更舒适。',wind:5,uv:3,forecast:[['多云','cloud',24,17,10],['小雨','rain',22,16,55],['多云','cloud',25,17,15],['晴间多云','partly',27,18,10],['阵雨','showers',23,17,40],['多云','cloud',24,16,20],['晴朗','sun',26,17,0]]},
 tokyo:{name:'东京',now:19,feels:20,condition:'晴间多云',summary:'海风轻轻吹过，傍晚凉爽舒适。',wind:13,uv:4,forecast:[['晴朗','sun',23,16,0],['晴间多云','partly',24,17,5],['多云','cloud',22,16,15],['小雨','rain',20,15,60],['多云','cloud',21,15,15],['晴朗','sun',24,16,0],['阵雨','showers',21,15,35]]}
};
const icons={
 sun:'<circle cx="20" cy="20" r="7"/><g class="rays"><path d="M20 2v4m0 28v4M2 20h4m28 0h4M7.3 7.3l2.8 2.8m19.8 19.8 2.8 2.8m0-25.4-2.8 2.8M10.1 29.9l-2.8 2.8"/></g>',
 cloud:'<path d="M11 30h18a7 7 0 0 0 0-14 10 10 0 0 0-19-2 8 8 0 0 0 1 16Z"/>',
 partly:'<circle cx="27" cy="14" r="7"/><path d="M27 2v3m0 18v3m12-12h-3m-18 0h-3m17-8-2 2m-12 12-2 2m19-14-2 2m-12 12-2 2"/><path d="M7 33h19a6 6 0 0 0 0-12 9 9 0 0 0-17-2 7 7 0 0 0-2 14Z"/>',
 rain:'<path d="M10 23h19a7 7 0 0 0 0-14 10 10 0 0 0-19-2 8 8 0 0 0 0 16Z"/><path d="m14 27-2 5m10-5-2 5m10-5-2 5"/>',
 showers:'<path d="M10 22h19a7 7 0 0 0 0-14 10 10 0 0 0-19-2 8 8 0 0 0 0 16Z"/><path d="m15 27-2 5m10-5-2 5"/>',
 storm:'<path d="M10 22h19a7 7 0 0 0 0-14 10 10 0 0 0-19-2 8 8 0 0 0 0 16Z"/><path d="m20 25-5 8h6l-1 6 7-10h-6l2-4"/>'
};
const $=id=>document.getElementById(id), select=$('city');let fahrenheit=false;
function icon(type){return `<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${icons[type]||icons.cloud}</svg>`}
function dateLabels(){const now=new Date();const weekdays=['周日','周一','周二','周三','周四','周五','周六'];return Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()+i);return i===0?'今天':weekdays[d.getDay()]})}
function formatTemp(c){return fahrenheit?`${Math.round(c*9/5+32)}°`:`${c}°`}
function render(){const data=cities[select.value];$('location').textContent=data.name;$('current').textContent=fahrenheit?Math.round(data.now*9/5+32):data.now;$('condition').textContent=data.condition;$('summary').textContent=data.summary;$('feels').textContent=formatTemp(data.feels);$('wind').textContent=`${data.wind} km/h`;$('uv').textContent=`${data.uv<4?'偏低':data.uv<7?'中等':'较强'} · ${data.uv}`;$('unit').textContent=fahrenheit?'°F':'°C';$('date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date())+' · 今日';const labels=dateLabels();$('days').innerHTML=data.forecast.map((f,i)=>`<article class="day ${i===0?'today':''}"><div class="day-label">${labels[i]}</div><div class="day-icon">${icon(f[1])}</div><div class="day-condition">${f[0]}</div><div class="temps"><span>${formatTemp(f[2])}</span><small>${formatTemp(f[3])}</small></div><div class="precip">${f[4]?`◌　${f[4]}% 降水`:'☼　降水较少'}</div></article>`).join('')}
select.addEventListener('change',render);$('unit').addEventListener('click',()=>{fahrenheit=!fahrenheit;render()});$('refresh').addEventListener('click',()=>{const b=$('refresh');b.textContent='✓　预报已更新';setTimeout(()=>b.textContent='↻　更新预报',1500)});
const stars=$('stars');for(let i=0;i<100;i++){const s=document.createElement('i');s.className='star';s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';s.style.animationDelay=(-Math.random()*4)+'s';s.style.transform=`scale(${.55+Math.random()*1.2})`;stars.appendChild(s)}render();
})();
</script>
</body>
</html>
