<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · Snake</title>
<style>
  :root { color-scheme: dark; --bg:#101713; --panel:#19231d; --line:#304137; --text:#edf5e9; --muted:#99ad9d; --green:#a7ed73; --green2:#61bd68; --red:#ff726e; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:radial-gradient(ellipse at 50% 0%,#263b2b 0%,var(--bg) 60%); }
  .layout { width:min(100%,760px); }
  header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:16px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .mark { display:grid; place-items:center; width:44px; height:44px; border-radius:14px; color:#122014; background:var(--green); font-size:24px; box-shadow:0 5px 22px #a7ed7333; }
  h1 { margin:0; font-size:clamp(21px,4vw,29px); letter-spacing:.02em; }
  .subtitle { margin:3px 0 0; color:var(--muted); font-size:13px; }
  .stats { display:flex; gap:10px; }
  .stat { min-width:86px; padding:9px 14px; text-align:center; border:1px solid var(--line); border-radius:13px; background:#17211b; }
  .stat span { display:block; color:var(--muted); font-size:11px; }
  .stat strong { display:block; margin-top:2px; font-size:20px; font-variant-numeric:tabular-nums; }
  .game-shell { position:relative; overflow:hidden; padding:12px; border:1px solid #3b5042; border-radius:20px; background:#17211b; box-shadow:0 24px 70px #0007; }
  canvas { display:block; width:100%; height:auto; aspect-ratio:1; border-radius:11px; background:#111a14; }
  .overlay { position:absolute; inset:12px; display:grid; place-items:center; padding:24px; border-radius:11px; background:#0c130ed9; text-align:center; transition:opacity .18s; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .message { max-width:360px; }
  .message .emoji { font-size:42px; }
  .message h2 { margin:8px 0; font-size:26px; }
  .message p { margin:0 0 18px; color:#b3c2b4; line-height:1.7; }
  button { border:0; border-radius:11px; padding:11px 20px; color:#142015; background:var(--green); font:700 15px inherit; cursor:pointer; transition:transform .12s,filter .12s; }
  button:hover { filter:brightness(1.08); transform:translateY(-1px); }
  button:active { transform:translateY(1px); }
  .bottom { display:flex; justify-content:space-between; gap:14px; align-items:center; margin-top:14px; color:var(--muted); font-size:13px; }
  .keys { display:flex; flex-wrap:wrap; gap:7px; }
  kbd { min-width:28px; padding:4px 7px; border:1px solid #405447; border-bottom-width:2px; border-radius:6px; color:#dce9dc; background:#1a281f; font:12px ui-monospace,monospace; text-align:center; }
  .hint { text-align:right; }
  @media(max-width:520px) { body{padding:16px} header{align-items:flex-start; flex-direction:column} .stats{width:100%} .stat{flex:1} .bottom{align-items:flex-start; flex-direction:column} .hint{text-align:left} }
</style>
</head>
<body>
<main class="layout">
  <header>
    <div class="brand"><div class="mark">蛇</div><div><h1>贪吃蛇</h1><p class="subtitle">慢慢吃，别撞上自己。</p></div></div>
    <div class="stats"><div class="stat"><span>本局得分</span><strong id="score">0</strong></div><div class="stat"><span>历史最高</span><strong id="best">0</strong></div></div>
  </header>
  <section class="game-shell" aria-label="贪吃蛇游戏区域">
    <canvas id="board" width="600" height="600" aria-label="贪吃蛇棋盘"></canvas>
    <div class="overlay" id="overlay"><div class="message"><div class="emoji" id="emoji">🐍</div><h2 id="title">准备好了吗？</h2><p id="desc">用方向键控制蛇移动，按住空格键加速。吃到苹果得分，撞墙或撞到自己就结束。</p><button id="start">开始游戏</button></div></div>
  </section>
  <footer class="bottom"><div class="keys"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd><span>移动</span><kbd>Space</kbd><span>按住加速</span></div><div class="hint">按 <kbd>P</kbd> 暂停 / 继续</div></footer>
</main>
<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const N = 24, CELL = canvas.width / N;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const descEl = document.getElementById('desc');
  const emojiEl = document.getElementById('emoji');
  const startBtn = document.getElementById('start');
  let snake, direction, nextDirection, apple, score, best = 0;
  let running = false, paused = false, accelerating = false, lastTime = 0, accumulator = 0;
  try { best = Number(localStorage.getItem('snake-best') || 0); } catch (_) {}
  bestEl.textContent = best;

  function randomApple() {
    const free = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
      if (!snake.some(part => part.x === x && part.y === y)) free.push({x,y});
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }
  function reset() {
    snake = [{x:11,y:12},{x:10,y:12},{x:9,y:12}];
    direction = {x:1,y:0}; nextDirection = {x:1,y:0};
    score = 0; scoreEl.textContent = score; apple = randomApple();
    paused = false; running = true; accumulator = 0; lastTime = 0;
    overlay.classList.add('hidden'); draw(); requestAnimationFrame(loop);
  }
  function endGame(won = false) {
    running = false; accelerating = false;
    emojiEl.textContent = won ? '🏆' : '💥';
    titleEl.textContent = won ? '棋盘清空！' : '游戏结束';
    descEl.textContent = won ? `太厉害了！最终得分：${score}` : `最终得分：${score}。再来一局，刷新你的最高纪录！`;
    startBtn.textContent = '再玩一次'; overlay.classList.remove('hidden');
  }
  function setDirection(x,y) {
    if (x === -direction.x && y === -direction.y) return;
    nextDirection = {x,y};
  }
  function step() {
    direction = nextDirection;
    const head = {x:snake[0].x + direction.x, y:snake[0].y + direction.y};
    if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N) return endGame();
    const eating = apple && head.x === apple.x && head.y === apple.y;
    const body = eating ? snake : snake.slice(0,-1);
    if (body.some(part => part.x === head.x && part.y === head.y)) return endGame();
    snake.unshift(head);
    if (eating) {
      score += 10; scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('snake-best', best); } catch (_) {} }
      apple = randomApple();
      if (!apple) return endGame(true);
    } else snake.pop();
  }
  function roundedRect(x,y,w,h,r) {
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  }
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#111a14'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#ffffff08'; ctx.lineWidth = 1;
    for (let i=1;i<N;i++) { ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke(); }
    if (apple) {
      const cx=(apple.x+.5)*CELL, cy=(apple.y+.53)*CELL;
      ctx.fillStyle='#ff726e'; ctx.beginPath(); ctx.arc(cx,cy,CELL*.34,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffaaa0'; ctx.beginPath(); ctx.arc(cx-CELL*.1,cy-CELL*.11,CELL*.09,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#9edb69'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(cx+2,cy-CELL*.27); ctx.quadraticCurveTo(cx+4,cy-CELL*.47,cx+CELL*.2,cy-CELL*.4); ctx.stroke();
    }
    snake.forEach((part,i) => {
      const pad = i===0 ? 2.5 : 3.5, x=part.x*CELL+pad, y=part.y*CELL+pad, size=CELL-pad*2;
      ctx.fillStyle = i===0 ? '#b6f486' : `hsl(${118 - Math.min(i,10)*2} 48% ${57 - Math.min(i,10)*1.1}%)`;
      roundedRect(x,y,size,size, i===0 ? 7 : 5); ctx.fill();
      if (i===0) {
        const px = direction.x === 0 ? x+size*.25 : direction.x > 0 ? x+size*.68 : x+size*.3;
        const py = direction.y === 0 ? y+size*.25 : direction.y > 0 ? y+size*.68 : y+size*.3;
        const px2 = direction.x === 0 ? x+size*.72 : px;
        const py2 = direction.y === 0 ? py : y+size*.72;
        ctx.fillStyle='#203525'; ctx.beginPath(); ctx.arc(px,py,2.2,0,Math.PI*2); ctx.arc(px2,py2,2.2,0,Math.PI*2); ctx.fill();
      }
    });
  }
  function loop(time) {
    if (!running) return;
    if (!lastTime) lastTime = time;
    accumulator += Math.min(time-lastTime,100); lastTime = time;
    const interval = accelerating ? 65 : Math.max(82, 135 - Math.floor(score/50)*5);
    while (accumulator >= interval && running) { step(); accumulator -= interval; }
    draw();
    if (running) requestAnimationFrame(loop);
  }
  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      running = false; emojiEl.textContent='⏸️'; titleEl.textContent='暂停中'; descEl.textContent='休息一下，准备好后继续。'; startBtn.textContent='继续游戏'; overlay.classList.remove('hidden');
    } else { overlay.classList.add('hidden'); running=true; lastTime=0; requestAnimationFrame(loop); }
  }
  document.addEventListener('keydown', e => {
    const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Space'];
    if (keys.includes(e.key)) e.preventDefault();
    if (e.key === ' ' || e.code === 'Space') { accelerating=true; return; }
    if (e.key.toLowerCase() === 'p') { togglePause(); return; }
    if (e.key === 'ArrowUp') setDirection(0,-1);
    if (e.key === 'ArrowDown') setDirection(0,1);
    if (e.key === 'ArrowLeft') setDirection(-1,0);
    if (e.key === 'ArrowRight') setDirection(1,0);
  });
  document.addEventListener('keyup', e => { if (e.key === ' ' || e.code === 'Space') accelerating=false; });
  window.addEventListener('blur', () => { accelerating=false; });
  startBtn.addEventListener('click', () => { if (paused) { paused=false; running=true; overlay.classList.add('hidden'); lastTime=0; requestAnimationFrame(loop); } else reset(); });
  draw();
})();
</script>
</body>
</html>
